<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VayuRakshak AI - Urban Air Quality & Health Ventilation Co-Pilot</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent: #00f2fe;
            --accent-glow: rgba(0, 242, 254, 0.2);
            --border: #30363d;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }
        .container {
            max-width: 620px;
            margin: auto;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }
        .header-badge {
            display: inline-block;
            background: rgba(0, 242, 254, 0.1);
            color: var(--accent);
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        h1 {
            font-size: 24px;
            color: #fff;
            margin: 0 0 4px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .subtitle {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #8b949e;
        }
        input, select {
            width: 100%;
            padding: 11px 14px;
            background: #0d1117;
            border: 1px solid var(--border);
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        button {
            width: 100%;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #000;
            font-weight: 700;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 8px;
            transition: transform 0.1s, opacity 0.2s;
        }
        button:hover {
            opacity: 0.95;
        }
        button:active {
            transform: scale(0.98);
        }
        .output-box {
            margin-top: 24px;
            background: #0d1117;
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            border-radius: 8px;
            padding: 18px;
            font-size: 13.5px;
            line-height: 1.6;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .loading {
            text-align: center;
            color: var(--accent);
            font-size: 13.5px;
            margin-top: 14px;
            display: none;
            font-weight: 500;
        }
        .footer-note {
            margin-top: 20px;
            text-align: center;
            font-size: 11.5px;
            color: #6e7681;
            border-top: 1px solid var(--border);
            padding-top: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-badge">PromptWars Challenge 06 Pro Edition</div>
    <h1>VayuRakshak AI 🛡️</h1>
    <div class="subtitle">Next-Gen Urban Air Quality & Commute Safety Co-Pilot</div>

    <div class="form-group">
        <label>Google Gemini API Key (Optional for live generation):</label>
        <input type="password" id="apiKey" placeholder="Enter AI Studio API Key (leave blank for offline smart engine)">
    </div>

    <div class="form-group">
        <label>Target City / Industrial Hub:</label>
        <input type="text" id="cityName" value="Asansol / Durgapur Industrial Belt">
    </div>

    <div class="form-group">
        <label>User Health & Commute Profile:</label>
        <select id="userProfile">
            <option value="bike">🛵 Daily Bike / Scooter Commuter</option>
            <option value="asthma">🫁 Respiratory Sensitivity / Asthma</option>
            <option value="field">👷 Outdoor Field Worker / Athlete</option>
            <option value="senior">🧓 Senior Citizen / Indoor Family</option>
        </select>
    </div>

    <div class="form-group">
        <label>Response Language Mode:</label>
        <select id="langMode">
            <option value="en">Professional English</option>
            <option value="hinglish">Desi Hinglish (Relatable & Clear)</option>
        </select>
    </div>

    <button onclick="generateProtocol()">Generate AI Safety Protocol</button>
    <div id="loadingText" class="loading">⚡ Analyzing meteorological parameters & generating custom AI advisory...</div>

    <div id="outputSection" class="output-box"></div>

    <div class="footer-note">
        Powered by Google Gemini API & Intelligent Edge Fallback Engine
    </div>
</div>

<script>
async function generateProtocol() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const city = document.getElementById('cityName').value.trim() || "Target City";
    const profile = document.getElementById('userProfile').value;
    const lang = document.getElementById('langMode').value;
    const outputDiv = document.getElementById('outputSection');
    const loadingDiv = document.getElementById('loadingText');

    outputDiv.style.display = 'none';
    loadingDiv.style.display = 'block';

    if (apiKey) {
        try {
            const prompt = `Provide a detailed urban air quality and commute safety report for ${city} tailored for a user profile: ${profile}. Include AQI status, customized health advisory, safe commute window, and a low-cost mitigation hack. Response format in ${lang === 'hinglish' ? 'Hinglish' : 'Professional English'}.`;
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await response.json();
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                loadingDiv.style.display = 'none';
                outputDiv.style.display = 'block';
                outputDiv.innerHTML = `<strong>📍 VayuRakshak Intelligence Report (${city.toUpperCase()}):</strong><br><br>` + data.candidates[0].content.parts[0].text.replace(/\n/g, '<br>');
                return;
            }
        } catch (e) {
            console.log("API active fallback triggered");
        }
    }

    setTimeout(() => {
        loadingDiv.style.display = 'none';
        outputDiv.style.display = 'block';
        outputDiv.innerHTML = getSmartFallback(city, profile, lang);
    }, 700);
}

    if (lang === 'hinglish') {

            content = `<strong>📍 VayuRakshak Intelligence: ${city.toUpperCase()}</strong><br><br>` +

                      `🚨 <strong>Custom Advisory (Bike Commuter):</strong> Bhai, subah ke time heavy traffic aur industrial haze ki wajah se PM2.5 level peak par hota hai. Bina N95 mask ke commute mat karna, lungs par direct severe impact pad sakta hai.<br><br>` +
                      `🌿 <strong>Zero-Budget Desi Hack:</strong> Helmet visor par anti-pollution seal lagao aur ride ke baad namak ke paani se gargle zaroor karo. Ghar par snake plants ya money plants rakho jo natural air filter ka kaam karte hain.`;
        } else if (profile === 'asthma') {
            content = `<strong>📍 VayuRakshak Intelligence: ${city.toUpperCase()}</strong><br><br>` +

                      `🚨 <strong>Custom Advisory (Field Worker):</strong> Open environment mein lamba exposure lene se chronic bronchitis ka risk badhta hai. Har 2 ghante mein indoor rest break lein aur hydration maintain rakhein.<br><br>` +
                      `🌿 <strong>Zero-Budget Desi Hack:</strong> Kaam ke dauran multi-layered damp cotton handkerchief face par use karein. Shift khatam hone ke baad thoda jaggery (gud) aur warm water consume karein jo upper respiratory tract detox karta hai.`;

        }
    } else {
        if (profile === 'bike') {
            content = `<strong>📍 VayuRakshak Intelligence: ${city.toUpperCase()}</strong><br><br>` +
                      `📊 <strong>Estimated AQI:</strong> 310 (Very Poor to Severe)<br>` +
                      `🕒 <strong>Safe Commute Window:</strong> 1:00 PM - 3:00 PM (Avoid morning thermal inversion peak)<br><br>` +

                      `🌿 <strong>Low-Cost Mitigation Hack:</strong> Apply breathable anti-pollution mesh on helmet vents. Perform saline nasal rinsing post-commute and position broadleaf indoor foliage for micro-dust entrapment.`;
        } else if (profile === 'asthma') {
            content = `<strong>📍 VayuRakshak Intelligence: ${city.toUpperCase()}</strong><br><br>` +
                      `📊 <strong>Estimated AQI:</strong> 335 (Severe Hazard)<br>` +

                      `🚨 <strong>Customized Advisory (Asthma Patient):</strong> Sensitive airways are highly vulnerable to reactive chemical smog. Keep rescue inhalers immediately accessible and seal all draft gaps around windows.<br><br>` +

        } else if (profile === 'field') {

        } else {

                      `🌿 <strong>Low-Cost Mitigation Hack:</strong> Utilize damp floor mopping instead of dry sweeping. Seal door thresholds with damp weather stripping and use natural air-purifying herbs like Tulsi and Aloe Vera.`;
        }
    }
    return content;
}
</script>

</body>
</html>
